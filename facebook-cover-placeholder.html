<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIDF Facebook Cover Placeholder</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap"
    rel="stylesheet"
  >
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }

    /* ── Cover shell ── */
    /* Facebook recommended: 820 × 312 px */
    .cover {
      position: relative;
      width: 820px;
      height: 312px;
      background: #0A0A14;
      overflow: hidden;
      flex-shrink: 0;

      /* Top + bottom accent lines via pseudo-elements */
    }

    .cover::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, #C4841A, #C4841A88, #C4841A22);
      z-index: 20;
    }
    .cover::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(to right, #C4841A55, #C4841A22, transparent);
      z-index: 20;
    }

    /* ── Background photo at low opacity ── */
    .bg-photo {
      position: absolute;
      inset: 0;
      background:
        url('images/hero/Finale Gala Showcase-Stijn Dejonckheere.jpg')
        center 35% / cover no-repeat;
      opacity: 0.13;
      filter: grayscale(30%);
    }

    /* ── Warm radial glow on the left (evokes stage light / warmth) ── */
    .bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 55% 100% at 0% 50%,
        rgba(181, 66, 26, 0.18) 0%,
        rgba(10, 10, 20, 0) 65%
      );
    }

    /* ── Left rust border ── */
    .left-border {
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: #B5421A;
      opacity: 0.72;
      z-index: 10;
    }

    /* ── Mandala SVG — floats on the right, partially off-canvas ── */
    .mandala {
      position: absolute;
      right: -72px;
      top: 50%;
      transform: translateY(-50%);
      width: 460px;
      height: 460px;
      opacity: 0.62;
      pointer-events: none;
    }

    /* ── Text content ── */
    .content {
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 5;
    }

    .festival-label {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      color: #5C4D38;
      letter-spacing: 3.8px;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .title-gidf {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 106px;
      font-weight: 900;
      font-style: italic;
      line-height: 0.88;
      letter-spacing: -4px;
      margin-bottom: 11px;

      /* White → warm cream gradient fill */
      background: linear-gradient(140deg, #FFFFFF 0%, #EAD9C4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .edition-badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(181, 66, 26, 0.60);
      background: rgba(181, 66, 26, 0.08);
      border-radius: 3px;
      padding: 4px 11px;
      width: fit-content;
      margin-bottom: 14px;
    }

    .edition-badge span {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #C4841A;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Divider rule with centre diamond */
    .divider {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      width: 340px;
    }
    .divider-line {
      height: 1px;
      background: rgba(196, 132, 26, 0.38);
      flex: 1;
    }
    .divider-diamond {
      width: 6px;
      height: 6px;
      background: #C4841A;
      opacity: 0.68;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .message {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 17.5px;
      font-style: italic;
      color: #E5D9C8;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
    }

    .teaser {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: #C4841A;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Small bottom-right attribution */
    .attribution {
      position: absolute;
      bottom: 12px;
      right: 18px;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 8px;
      font-weight: 500;
      color: #2A1F14;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="cover">

  <!-- Layered background -->
  <div class="bg-photo"></div>
  <div class="bg-glow"></div>
  <div class="left-border"></div>

  <!-- ═══════════════════════════════════════
       Rangoli-style mandala (right side)
       ═══════════════════════════════════════ -->
  <svg class="mandala" viewBox="-230 -230 460 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="mg" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#C4841A" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#0A0A14" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Ambient glow -->
    <circle r="228" fill="url(#mg)"/>

    <!-- Concentric rings -->
    <circle r="210" fill="none" stroke="#C4841A" stroke-width="0.4" opacity="0.14"/>
    <circle r="186" fill="none" stroke="#C4841A" stroke-width="0.5" opacity="0.20"/>
    <circle r="156" fill="none" stroke="#B5421A" stroke-width="0.7" opacity="0.26"/>
    <circle r="124" fill="none" stroke="#C4841A" stroke-width="0.9" opacity="0.34"/>
    <circle r="90"  fill="none" stroke="#B5421A" stroke-width="1"   opacity="0.42"/>
    <circle r="57"  fill="none" stroke="#C4841A" stroke-width="1.2" opacity="0.56"/>
    <circle r="22"  fill="#B5421A" opacity="0.10"/>
    <circle r="22"  fill="none"   stroke="#C4841A" stroke-width="1.5" opacity="0.70"/>
    <circle r="5"   fill="#C4841A" opacity="0.80"/>

    <!-- Inner 8-pointed star (two squares) -->
    <rect x="-64" y="-64" width="128" height="128" fill="none"
          stroke="#C4841A" stroke-width="0.9" opacity="0.45"/>
    <rect x="-64" y="-64" width="128" height="128" fill="none"
          stroke="#C4841A" stroke-width="0.9" opacity="0.45" transform="rotate(45)"/>

    <!-- Outer 8-pointed star -->
    <rect x="-113" y="-113" width="226" height="226" fill="none"
          stroke="#B5421A" stroke-width="0.6" opacity="0.22"/>
    <rect x="-113" y="-113" width="226" height="226" fill="none"
          stroke="#B5421A" stroke-width="0.6" opacity="0.22" transform="rotate(45)"/>

    <!-- Inner lotus petals (8 × ellipse, each rotated 45°) -->
    <g fill="none" stroke="#C4841A" stroke-width="1" opacity="0.55">
      <ellipse rx="11" ry="33" cy="-73"/>
      <ellipse rx="11" ry="33" cy="-73" transform="rotate(45)"/>
      <ellipse rx="11" ry="33" cy="-73" transform="rotate(90)"/>
      <ellipse rx="11" ry="33" cy="-73" transform="rotate(135)"/>
      <ellipse rx="11" ry="33" cy="-73" transform="rotate(180)"/>
      <ellipse rx="11" ry="33" cy="-73" transform="rotate(225)"/>
      <ellipse rx="11" ry="33" cy="-73" transform="rotate(270)"/>
      <ellipse rx="11" ry="33" cy="-73" transform="rotate(315)"/>
    </g>

    <!-- Outer lotus petals -->
    <g fill="none" stroke="#B5421A" stroke-width="0.7" opacity="0.28">
      <ellipse rx="9" ry="29" cy="-140"/>
      <ellipse rx="9" ry="29" cy="-140" transform="rotate(45)"/>
      <ellipse rx="9" ry="29" cy="-140" transform="rotate(90)"/>
      <ellipse rx="9" ry="29" cy="-140" transform="rotate(135)"/>
      <ellipse rx="9" ry="29" cy="-140" transform="rotate(180)"/>
      <ellipse rx="9" ry="29" cy="-140" transform="rotate(225)"/>
      <ellipse rx="9" ry="29" cy="-140" transform="rotate(270)"/>
      <ellipse rx="9" ry="29" cy="-140" transform="rotate(315)"/>
    </g>

    <!-- Accent dots at r=124 -->
    <g fill="#C4841A" opacity="0.65">
      <circle cy="-124" r="3"/>
      <circle cy="-124" r="3" transform="rotate(45)"/>
      <circle cy="-124" r="3" transform="rotate(90)"/>
      <circle cy="-124" r="3" transform="rotate(135)"/>
      <circle cy="-124" r="3" transform="rotate(180)"/>
      <circle cy="-124" r="3" transform="rotate(225)"/>
      <circle cy="-124" r="3" transform="rotate(270)"/>
      <circle cy="-124" r="3" transform="rotate(315)"/>
    </g>

    <!-- Accent dots at r=186 -->
    <g fill="#B5421A" opacity="0.36">
      <circle cy="-186" r="2"/>
      <circle cy="-186" r="2" transform="rotate(45)"/>
      <circle cy="-186" r="2" transform="rotate(90)"/>
      <circle cy="-186" r="2" transform="rotate(135)"/>
      <circle cy="-186" r="2" transform="rotate(180)"/>
      <circle cy="-186" r="2" transform="rotate(225)"/>
      <circle cy="-186" r="2" transform="rotate(270)"/>
      <circle cy="-186" r="2" transform="rotate(315)"/>
    </g>

    <!-- 16 radiating spokes -->
    <g stroke="#C4841A" stroke-width="0.4" opacity="0.16">
      <line y1="-22" y2="-210"/>
      <line y1="-22" y2="-210" transform="rotate(22.5)"/>
      <line y1="-22" y2="-210" transform="rotate(45)"/>
      <line y1="-22" y2="-210" transform="rotate(67.5)"/>
      <line y1="-22" y2="-210" transform="rotate(90)"/>
      <line y1="-22" y2="-210" transform="rotate(112.5)"/>
      <line y1="-22" y2="-210" transform="rotate(135)"/>
      <line y1="-22" y2="-210" transform="rotate(157.5)"/>
      <line y1="-22" y2="-210" transform="rotate(180)"/>
      <line y1="-22" y2="-210" transform="rotate(202.5)"/>
      <line y1="-22" y2="-210" transform="rotate(225)"/>
      <line y1="-22" y2="-210" transform="rotate(247.5)"/>
      <line y1="-22" y2="-210" transform="rotate(270)"/>
      <line y1="-22" y2="-210" transform="rotate(292.5)"/>
      <line y1="-22" y2="-210" transform="rotate(315)"/>
      <line y1="-22" y2="-210" transform="rotate(337.5)"/>
    </g>

    <!-- Small diamond marks between petals (at ~r=93) -->
    <g fill="#C4841A" opacity="0.50">
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(22.5)"/>
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(67.5)"/>
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(112.5)"/>
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(157.5)"/>
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(202.5)"/>
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(247.5)"/>
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(292.5)"/>
      <polygon points="0,-96 2.5,-93 0,-90 -2.5,-93" transform="rotate(337.5)"/>
    </g>
  </svg>

  <!-- ═══════════════════════════════════════
       Text content
       ═══════════════════════════════════════ -->
  <div class="content">
    <div class="festival-label">Gent India Dans Festival · Ghent, Belgium</div>
    <div class="title-gidf">GIDF</div>
    <div class="edition-badge"><span>Edition IV · 2026</span></div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>
    <div class="message">Until we dance again.</div>
    <div class="teaser">Back in May 2027 · Edition Five</div>
  </div>

  <div class="attribution">ABC a Bollywood Company · Ghent</div>

</div>

</body>
</html>
